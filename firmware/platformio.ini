; Waveshare e-Paper ESP32 Driver Board (Rev 3: ESP32-WROOM-32E, CH343 USB serial)
; driving the 5.65" 7-color ACeP panel.
;
;   pio run -e bringup -t upload -t monitor   # color bars, no Wi-Fi: proves the wiring
;   pio run -e quotes  -t upload -t monitor   # the real thing

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:quotes]

[env:bringup]
build_flags = -D BRINGUP
